<!--
Candidate card partial, included once per candidate from
dashboard_template.html's EXECUTE/WATCHLIST loops. Inherits the loop
variable `c` from the including for-loop's own context (Jinja2's
default include behavior).
Styles copied byte-for-byte from the mockup's own card markup; the
category-left-border color/background-tint differ between EXECUTE
(green) and WATCHLIST (amber) exactly as the mockup's two separate
(but near-identical) card blocks did -- driven here by c.categoryColor/
c.category instead of two copy-pasted blocks.
-->
<div onclick="falconOpenCandidate('{{ c.id }}')" class="falcon-card-hover" style="cursor:pointer;background:oklch(0.20 0.014 250);border:1px solid {{ 'oklch(0.30 0.05 150 / 0.35)' if c.category == 'EXECUTE' else 'oklch(0.35 0.06 80 / 0.35)' }};border-left:3px solid {{ c.categoryColor }};border-radius:8px;padding:16px 20px;display:flex;align-items:center;gap:20px;">
  <div style="min-width:130px;">
    <div style="font-size:15px;font-weight:700;letter-spacing:-0.01em;">{{ c.symbol }}</div>
    <div style="display:flex;align-items:baseline;gap:7px;margin-top:2px;">
      <span class="mono" style="font-size:13px;">{{ c.priceFmt }}</span>
      <span class="mono" style="font-size:11.5px;font-weight:600;color:{{ c.changeColor }};">{{ c.changeFmt }}</span>
    </div>
  </div>
  <div style="width:56px;height:56px;border-radius:50%;background:{{ c.gaugeBg }};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
    <div style="width:44px;height:44px;border-radius:50%;background:oklch(0.20 0.014 250);display:flex;align-items:center;justify-content:center;">
      <span class="mono" style="font-size:14px;font-weight:700;">{{ c.conf }}</span>
    </div>
  </div>
  <div style="flex:1;display:flex;flex-wrap:wrap;gap:6px;">
    {% for f in c.factors %}
    <span style="font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:12px;background:oklch(0.27 0.05 150 / 0.5);color:oklch(0.82 0.15 150);border:1px solid oklch(0.4 0.1 150 / 0.4);">{{ f }}</span>
    {% endfor %}
    {% for r in c.riskFlags %}
    <span style="font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:12px;background:oklch(0.3 0.09 45 / 0.45);color:oklch(0.82 0.13 60);border:1px solid oklch(0.45 0.12 50 / 0.5);">&#9888; {{ r }}</span>
    {% endfor %}
  </div>
  <div style="text-align:right;min-width:110px;">
    <div style="font-size:10.5px;color:oklch(0.58 0.01 250);">{{ c.sector }}</div>
    <div class="mono" style="font-size:12.5px;font-weight:600;margin-top:2px;">RS {{ c.rsRating }}</div>
  </div>
</div>
