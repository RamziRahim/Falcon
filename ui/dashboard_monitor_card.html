<!--
MONITOR-tier candidate card partial, included once per candidate from
dashboard_template.html's MONITOR loop. Inherits the loop variable `c`
(a build_monitor_candidate_view() dict, not build_candidate_view()'s
shape) from the including for-loop's own context.

Deliberately no confidence-gauge circle (unlike dashboard_candidate_card.html)
-- the calibrated model never scores a MONITOR candidate (B-8: capped
before reaching it), so a gauge here would either be blank/misleading or
require fabricating a value categorize() never produced. In its place:
the real Trend_State, RS Rating, the one honest reason this tier caps
here, and whatever real partial pattern-setup state exists (or none, if
nothing is forming).

data-candidate-card (shared with dashboard_candidate_card.html) is how
falconOpenCandidate()'s JS finds and highlights whichever card is
currently charted -- see dashboard_template.html's script block.
-->
<div onclick="falconOpenCandidate('{{ c.id }}')" data-candidate-card="{{ c.id }}" class="falcon-card-hover" style="cursor:pointer;background:oklch(0.20 0.014 250);border:1px solid oklch(0.35 0.06 230 / 0.35);border-left:3px solid {{ c.categoryColor }};border-radius:8px;padding:16px 20px;display:flex;align-items:center;gap:20px;">
  <div style="min-width:130px;">
    <div style="font-size:15px;font-weight:700;letter-spacing:-0.01em;">{{ c.symbol }}</div>
    <div style="display:flex;align-items:baseline;gap:7px;margin-top:2px;">
      <span class="mono" style="font-size:13px;">{{ c.priceFmt }}</span>
      <span class="mono" style="font-size:11.5px;font-weight:600;color:{{ c.changeColor }};">{{ c.changeFmt }}</span>
    </div>
  </div>
  <div style="flex:1;min-width:0;">
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
      <span style="font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:12px;background:oklch(0.27 0.06 230 / 0.35);color:oklch(0.75 0.13 230);border:1px solid oklch(0.4 0.1 230 / 0.4);">{{ c.trendState }}</span>
      <span style="font-size:11px;color:oklch(0.73 0.01 250);">{{ c.monitorReason }}</span>
    </div>
    {% if c.setupState %}
    <div style="font-size:10.5px;color:oklch(0.71 0.01 250);margin-top:6px;">{{ c.setupState }}</div>
    {% endif %}
    {% if c.staleNotice %}
    <div style="margin-top:6px;">
      <span style="font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:12px;background:oklch(0.3 0.09 45 / 0.45);color:oklch(0.82 0.13 60);border:1px solid oklch(0.45 0.12 50 / 0.5);">&#9888; {{ c.staleNotice }}</span>
    </div>
    {% endif %}
  </div>
  <div style="text-align:right;min-width:110px;">
    <div style="font-size:10.5px;color:oklch(0.71 0.01 250);">{{ c.sector }}</div>
    <div class="mono" style="font-size:12.5px;font-weight:600;margin-top:2px;">RS {{ c.rsRating }}</div>
  </div>
</div>
